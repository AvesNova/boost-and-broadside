# Publication manifest — the complete canonical inventory.
#
# This file is the inventory: every output tracked under docs/ that the project
# treats as a result is declared here, together with the renderer that produces
# it. Nothing else decides what belongs in docs/, and `bnb publish` writes
# nothing that is not declared below.
#
# Every entry names its exact source. The computed figures are copied from a
# run's `figures` artifact, which `bnb figures` renders once from that run's own
# measurements; publishing chooses which run illustrates the documents and does
# not re-render anything. The curated replays are scratch clips promoted by
# content hash: `out/` is never tracked, so the sha256 below is what makes a
# published clip citable, and it is checked against the tracked output whether
# or not the scratch copy is still on this machine.

schema_version = 1

[publications.elo_curve]
renderer = "figure-copy-v1"
output = "docs/results/elo_curve.png"
figure = "elo_curve.png"
description = "Post-hoc calibrated Elo over training, against the scripted controller."

[publications.elo_curve.artifacts]
figures = "checkpoints/good-leaf-719/artifacts/figures"

