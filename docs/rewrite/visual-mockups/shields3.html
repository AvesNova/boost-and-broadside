<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#E9ECF0;font-family:Inter,Helvetica,Arial,sans-serif;color:#2A2F3A}
h1{font-size:26px;margin:0;padding:26px 30px 2px}p.sub{margin:0 30px 14px;color:#5A6272;font-size:15px}canvas{margin:0 30px 24px;border-radius:10px;border:1px solid #D5DAE1;display:block}
</style></head><body>
<h1>Centred arcs — more shield and energy combinations</h1>
<p class="sub">Shield in team blue, energy in graphite. Every arc shrinks toward its own centre. Bearings are relative to the nose (0°), clockwise. Columns move shield (S) and energy (E) independently.</p>
<canvas id="a"></canvas>
<script>
const BLUE='#2F6FD0',INK='#2A2F3A',BG='#F6F7F9',WARN='#D7263D',EN='#3A4150';
const SHIP=[[0,-50],[7,-32],[12,-8],[42,22],[40,30],[10,20],[7,34],[0,36]];
function ship(c,sc,rot,warn){c.save();c.rotate(rot);c.scale(sc,sc);c.beginPath();SHIP.concat(SHIP.slice().reverse().map(([a,b])=>[-a,b])).forEach(([a,b],i)=>i?c.lineTo(a,b):c.moveTo(a,b));c.closePath();c.fillStyle=BLUE;c.fill();if(warn){c.strokeStyle=WARN;c.lineWidth=3/sc;c.stroke()}c.restore()}
function arc(c,r,a0,a1,col,w,alpha=1){if(a1<=a0)return;c.beginPath();c.arc(0,0,r,a0,a1);c.strokeStyle=col;c.lineWidth=w;c.globalAlpha=alpha;c.lineCap='round';c.stroke();c.lineCap='butt';c.globalAlpha=1}
const D=Math.PI/180;
// part: {n, off (deg), span (deg total), r (offset from hitbox), col, w}
function part(c,p,v,head){const R=27+(p.r||0),gap=.2,half=(p.span*D)/(2*p.n)-gap/2;for(let k=0;k<p.n;k++){const m=head+(p.off||0)*D+k*(p.step?p.step*D:2*Math.PI/p.n);arc(c,R,m-half,m+half,p.col,p.w||3,.12);if(v>0)arc(c,R,m-half*v,m+half*v,p.col,p.w||3)}}
const S=(n,o)=>Object.assign({col:BLUE,w:3},o,{n}),E=(n,o)=>Object.assign({col:EN,w:2.4},o,{n});
const ROWS=[
 ['Halves, one ring','shield 180° on the nose, energy 180° on the tail',S(1,{span:180}),E(1,{span:180,off:180,w:3})],
 ['Halves, energy outside','shield half on the nose, energy half on an outer ring at the tail',S(1,{span:180}),E(1,{span:180,off:180,r:6})],
 ['Shares 240 / 120','shield 240° on the nose, energy 120° on the tail, one ring',S(1,{span:240}),E(1,{span:120,off:180,w:3})],
 ['Sides and tail','shield: two arcs on the sides (90°, 270°); energy: tail',S(2,{span:220,off:90}),E(1,{span:110,off:180,w:3})],
 ['Interleaved 3 + 3','shield at 0°, 120°, 240°; energy at 60°, 180°, 300°; one ring',S(3,{span:180}),E(3,{span:180,off:60,w:3})],
 ['Shield 6','six arcs, nose first',S(6,{span:360})],
 ['Shield 6 + energy tail','six shield arcs; energy arc on an outer ring at the tail',S(6,{span:360}),E(1,{span:140,off:180,r:6})],
 ['Interleaved 6 + 6','shield 6 inner, energy 6 outer, offset half a step',S(6,{span:360}),E(6,{span:300,off:30,r:6,w:2})],
 ['Shield 4 diagonal','arcs at 45°, 135°, 225°, 315°: open at nose and tail',S(4,{span:300,off:45})],
 ['Shield 12 beads','twelve short arcs; energy arc at the nose, outside',S(12,{span:360}),E(1,{span:120,r:6})],
 ['Shield 3 + energy tail inside','3-centre shield; energy arc inside at the tail',S(3,{span:360}),E(1,{span:120,off:180,r:-6})],
 ['Shield 1 + energy 2','shield full arc on the nose; energy on both sides, outside',S(1,{span:340}),E(2,{span:160,off:90,r:6})],
];
const COLS=[['S 100 · E 100',1,1],['S 75 · E 50',.75,.5],['S 50 · E 25',.5,.25],['S 25 · E 75',.25,.75],['S 0 · E 50',0,.5],['turning','S 50 · E 50',.5,.5,'rot'],['battle zoom','full · S 25, E 25',0,0,'small']];
function draw(c,x,y,row,s,e,rot=0,sc=1){c.save();c.translate(x,y);c.scale(sc,sc);const head=-Math.PI/2+rot;part(c,row[2],s,head);if(row[3])part(c,row[3],e,head);ship(c,.36,rot,s===0);c.restore()}
const LW=300,CW=150,RH=96,TOP=56,W=LW+CW*COLS.length+10,H=TOP+RH*ROWS.length+10;const cv=document.getElementById('a');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);
COLS.forEach((col,i)=>{const x=LW+i*CW;c.font='bold 13px Inter,Arial';c.fillStyle=INK;c.fillText(col[0],x+12,24);if(typeof col[1]==='string'){c.font='12px Inter,Arial';c.fillStyle='#5A6272';c.fillText(col[1],x+12,40)}});
ROWS.forEach((row,r)=>{const y=TOP+r*RH;if(r){c.fillStyle='#EEF0F3';c.fillRect(14,y-4,W-28,1)}c.fillStyle=INK;c.font='bold 14px Inter,Arial';c.fillText(`${r+1}. ${row[0]}`,20,y+36);c.font='12px Inter,Arial';c.fillStyle='#5A6272';
 const words=row[1].split(' ');let line='',yy=y+54;for(const wd of words){if(c.measureText(line+wd).width>265){c.fillText(line,20,yy);line='';yy+=15}line+=wd+' '}c.fillText(line,20,yy);
 COLS.forEach((col,i)=>{const cx=LW+i*CW+CW/2,cy=y+RH/2-4;c.fillStyle=BG;c.beginPath();c.roundRect(cx-62,cy-42,124,84,8);c.fill();
  if(col[4]==='small'){draw(c,cx-28,cy,row,1,1,0,.42);draw(c,cx+28,cy,row,.25,.25,0,.42)}
  else if(col[4]==='rot'){draw(c,cx-28,cy,row,.5,.5,Math.PI*.35,.62);draw(c,cx+28,cy,row,.5,.5,-Math.PI*.8,.62)}
  else draw(c,cx,cy,row,col[1],col[2])})});
</script></body></html>
