; /etc/supervisor/conf.d/onehead.conf (copied by setup): the heartbeat and the pipeline driver,
; both started at boot, so the box resumes on its own after an interruption.
[program:heartbeat]
command=/workspace/boost-and-broadside/docs/rewrite/sections/gpubox2/heartbeat.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/portal/heartbeat.log
redirect_stderr=true

[program:onehead]
command=/workspace/boost-and-broadside/docs/rewrite/sections/gpubox2/pipeline.sh
directory=/workspace/boost-and-broadside
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/var/log/portal/onehead.log
redirect_stderr=true
