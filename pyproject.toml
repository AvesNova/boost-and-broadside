[project]
name = "bnb"
version = "0.0.1"
description = "A runtime-fast implementation of the Yemong model, from its spec alone"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.5", "torch==2.15.0"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device", "slow: takes more than a few seconds"]
