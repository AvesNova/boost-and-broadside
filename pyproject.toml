[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boost-and-broadside"
version = "0.1.0"
description = "GPU-accelerated multi-agent RL environment where teams of ships compete in 2D dogfights, trained via PPO with ELO-rated league play."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.0.0",
    "pygame>=2.6.1",
    "torch>=2.10.0",
    "wandb>=0.22.2",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "pytest-tap>=3.4",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
