[project]
name = "bnb"
version = "0.0.1"
description = "Boost and Broadside v2: the game and its training stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "glfw>=2.11.0",
    "imgui-bundle>=1.93.0",
    "moderngl>=5.13.0",
    "numpy>=2.5",
    "platformdirs>=4.3",
    "safetensors>=0.8.0",
    "torch==2.15.0",
    "tyro>=1.0",
    "wandb>=0.31.0",
]

[project.optional-dependencies]
# Offline tools: `bnb ship-card` writes its charts with matplotlib.
tools = ["matplotlib>=3.10"]

[project.scripts]
bnb = "bnb.cli:main"

[dependency-groups]
dev = [
    "onnx",
    "onnxruntime>=1.31",
    "onnxscript",
    "pytest",
    "pytest-randomly",
    "pytest-xdist",
    "ruff",
]
# The documentation site (mkdocs.yml); a default group, so `uv sync` installs it and the
# strict build in tests/docs always runs.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "pyyaml>=6.0.3",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
# Design-record scripts and the race tests are kept as written.
extend-exclude = ["docs", "tests/reference"]

[tool.ruff.format]
# Formatted by the branch that owns them (the kernels and the store: fix/intermittent), so
# this pass leaves their diffs alone.
exclude = ["src/bnb/models/yemong/kernels/**", "src/bnb/runtime/store.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With -n, loadgroup keeps the gpu-marked tests together on one worker (tests/conftest.py).
addopts = "--dist loadgroup"
markers = [
    "gpu: needs a GPU (a CUDA device, or an OpenGL 3.3 context for the play shell)",
    "slow: takes more than a few seconds",
]
