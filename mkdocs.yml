site_name: Boost and Broadside
site_description: The game and its training stack (v2)
repo_name: AvesNova/boost-and-broadside
repo_url: https://github.com/AvesNova/boost-and-broadside
edit_uri: ""
copyright: MIT license

docs_dir: docs
# The design records under docs/rewrite/ are internal and stay out of the site. The hook
# and the roadmap data are build inputs, not pages.
exclude_docs: |
  rewrite/
  hooks/
  roadmap.yml
  packages.yml

theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

hooks:
  - docs/hooks/generated.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src, .]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_submodules: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

# Strict builds (tests/docs/test_build.py) turn every one of these warnings into a failure.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

