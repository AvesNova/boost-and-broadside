[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 45.8. W/S 186 kg/m^2 with CLmax ~1.4; 165 km/h."
g_limit = "estimated: g_limit 8. no published value found: the research's estimate"
cruise_speed = "researched (medium): cruise_speed 160.8. sea-level maximum speed, military power: airpages.ru (NII VVS-derived) (579 km/h)"
climb_time = "solved for an initial charge of g x 18 m/s; estimated: climb_rate 18. sea-level climb, military power: 5,000 m in 5.25 min (4.6 min forced)"
ceiling = "researched (medium): service_ceiling 10750; the store g h, J/kg. recalled standard figure, not re-checked"
low_speed_acceleration = "estimated: low_speed_acceleration 4.242. the research's point-mass model at 1.1 x stall, military power (4.82 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (medium): sustained_turn_rate 18.9; degrees. literature: airpages.ru (NII VVS-derived) (360 deg in 19.0 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 110; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: metal-spar wing, light ailerons; often compared with the Fw 190"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. no published value found: the research's estimate"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0205; rho C_D0 / (2 W/S) with W/S 185.6 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 1.92; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x ShVAK 20 mm (cowl): count x rate x projectile mass. Balanced (round 1): 18.78 -> 34.85 a shot, 187.8 -> 348.5 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the ShVAK 20 mm: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 770. the ShVAK 20 mm: Wikipedia"
bullet_spread = "estimated: dispersion 3.5; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "follows from the bullet life, cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 18 m/s), the standard fighter's ratio: a shot costs 255.4 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 3; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Air-cooled radial and pilot armour; wooden wing structure (metal spars) less resilient than all-metal designs. Balanced (round 3): 120 -> 110, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 4.9. half of the span 9.80 m"
spawn_energy = "placeholder: the standard fighter's fraction of the store"
