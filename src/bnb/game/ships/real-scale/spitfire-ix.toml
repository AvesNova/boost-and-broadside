[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 41.1. W/S 30.2 lb/sq ft with CLmax ~1.35 gives 93 mph; Pilot's Notes quote ~ 90-96 mph IAS flaps and undercarriage u...; 92 mph."
g_limit = "estimated: g_limit 8. no published limit found; pilots pulled 8-10 g with wrinkled skins; RAF fighters designed to factor ~ 8 limit"
cruise_speed = "researched (good): cruise_speed 150.2. sea-level maximum speed, military power: spitfireperformance.com trials (336 mph)"
climb_time = "solved for an initial charge of g x 23.5 m/s; researched (good): climb_rate 23.5. sea-level climb, military power: spitfireperformance.com trials (4620 ft/min). Paced: the climb rate 23.5 -> 94 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (good): service_ceiling 12470; the store g h, J/kg. spitfireperformance.com trials (40900 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 4.488. the research's point-mass model at 1.1 x stall, military power (5.1 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 19.5; degrees. literature: simulator/community turn-time compilations (360 deg in 18.5 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "researched (low): roll_rate 90; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: NACA TR-868 via secondary summaries"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. NACA 2213-2209.4 section, washout gives a gentle stall"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0194; rho C_D0 / (2 W/S) with W/S 147.3 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 3.83; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Hispano Mk II 20 mm (wing); 2x Browning AN/M2 .50 cal (wing): count x rate x projectile mass. Balanced (round 1): 37.47 -> 36.07 a shot, 374.7 -> 360.7 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 36.07 -> 67.63, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Hispano Mk II 20 mm, 2.60 of 3.83 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 880. the Hispano Mk II 20 mm, 2.60 of 3.83 kg/s: Wikipedia"
bullet_spread = "estimated: dispersion 4.6; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the Hispano 20 mm, a heavier shell than the .50's at a like ballistic coefficient"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 23.5 m/s), the standard fighter's ratio: a shot costs 333.4 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 2; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Light structure, liquid-cooled Merlin with wing radiators, main fuel tank ahead of the pilot. Pilot armour and armoured "
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
head_on_angle = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 5.613. half of the span 11.23 m (36.83 ft)"
