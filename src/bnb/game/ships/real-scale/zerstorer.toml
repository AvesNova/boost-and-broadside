[notes]
# Where each handle's value comes from.
stall_speed = "invented: stall_speed 53.64. the P-51D's x 1.2: Twin-engine destroyer with a concentrated nose battery."
g_limit = "invented: g_limit 6.5. Twin-engine destroyer with a concentrated nose battery."
cruise_speed = "invented: cruise_speed 157.8. the P-51D's x 0.97: Twin-engine destroyer with a concentrated nose battery."
climb_time = "solved for an initial charge of g x 14.44 m/s; invented: climb_rate 14.44. the P-51D's x 0.95: Twin-engine destroyer with a concentrated nose battery. Paced: the climb rate 14.44 -> 57.76 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "invented: service_ceiling 12050; the store g h, J/kg. the P-51D's x 0.95: Twin-engine destroyer with a concentrated nose battery."
low_speed_acceleration = "invented: low_speed_acceleration 2.592. the P-51D's x 0.95: Twin-engine destroyer with a concentrated nose battery."
sustained_turn_rate = "invented: sustained_turn_rate 11.77; degrees. the P-51D's x 0.75: Twin-engine destroyer with a concentrated nose battery."
half_lift_drag = "placeholder: the standard heavy's"
nose_reversal_time = "invented: roll_rate 57; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. the P-51D's x 0.6: Twin-engine destroyer with a concentrated nose battery."
dive_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
stall_angle = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
vision_range = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "invented: drag_coefficient 0.02445; rho C_D0 / (2 W/S) with W/S 231.1 kg/m^2 (invented). the P-51D's x 1.5: Twin-engine destroyer with a concentrated nose battery."
hit_damage = "invented: weight_of_fire 6.587; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 4x Hispano-class 20 mm @ 10/s (nose); 2x Browning .50-class 12.7 mm @ 15/s (nose): the P-51D's x 1.79. Balanced (round 1): 64.44 -> 37.06 a shot, 644.4 -> 370.6 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 37.06 -> 69.49, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "invented: fire_rate 10; proposal: the main gun's volley rate. the Hispano-class 20 mm, 5.2 of 6.58 kg/s"
muzzle_speed = "invented: muzzle_speed 860. the Hispano-class 20 mm, 5.2 of 6.58 kg/s"
bullet_spread = "invented: dispersion 3.18; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.53: Twin-engine destroyer with a concentrated nose battery."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the Hispano 20 mm, a heavier shell than the .50's at a like ballistic coefficient"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 14.44 m/s), the standard fighter's ratio: a shot costs 204.9 J/kg, 1.45 s of charge"
max_shield = "invented: survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Two engines, crew armour. Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard heavy's"
shield_recharge_delay = "placeholder: the standard heavy's"
head_on_fraction = "placeholder: the standard heavy's"
head_on_angle = "placeholder: the standard heavy's"
