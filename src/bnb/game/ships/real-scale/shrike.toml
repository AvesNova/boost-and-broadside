[notes]
# Where each handle's value comes from.
stall_speed = "invented: stall_speed 50.06. the P-51D's x 1.12: Roll-and-dive slasher (Fw 190 vibe)."
g_limit = "invented: g_limit 9. Roll-and-dive slasher (Fw 190 vibe)."
cruise_speed = "invented: cruise_speed 167.6. the P-51D's x 1.03: Roll-and-dive slasher (Fw 190 vibe)."
climb_time = "solved for an initial charge of g x 15.2 m/s; invented: climb_rate 15.2. the P-51D's x 1.0: Roll-and-dive slasher (Fw 190 vibe). Paced: the climb rate 15.2 -> 60.8 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "invented: service_ceiling 11410; the store g h, J/kg. the P-51D's x 0.9: Roll-and-dive slasher (Fw 190 vibe)."
low_speed_acceleration = "invented: low_speed_acceleration 2.728. the P-51D's x 1.0: Roll-and-dive slasher (Fw 190 vibe)."
sustained_turn_rate = "invented: sustained_turn_rate 13.82; degrees. the P-51D's x 0.88: Roll-and-dive slasher (Fw 190 vibe)."
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "invented: roll_rate 156.8; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. the P-51D's x 1.65: Roll-and-dive slasher (Fw 190 vibe)."
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "invented: drag_coefficient 0.01793; rho C_D0 / (2 W/S) with W/S 231.1 kg/m^2 (invented). the P-51D's x 1.1: Roll-and-dive slasher (Fw 190 vibe)."
hit_damage = "invented: weight_of_fire 4.416; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 4x MG 151/20-class 20 mm @ 10/s (wing_root); 2x MG 131-class 13 mm @ 10/s (cowl): the P-51D's x 1.2. Balanced (round 1): 43.2 -> 36.33 a shot, 432 -> 363.3 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "invented: fire_rate 10; proposal: the main gun's volley rate. the MG 151/20-class 20 mm, 3.68 of 4.40 kg/s"
muzzle_speed = "invented: muzzle_speed 805. the MG 151/20-class 20 mm, 3.68 of 4.40 kg/s"
bullet_spread = "invented: dispersion 3.72; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.62: Roll-and-dive slasher (Fw 190 vibe)."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 15.2 m/s), the standard fighter's ratio: a shot costs 215.6 J/kg, 1.45 s of charge"
max_shield = "invented: survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Radial engine in front, armour. Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
