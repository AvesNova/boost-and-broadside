hit_damage = "invented: weight_of_fire 1.362; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Browning .50-class 12.7 mm @ 15/s (cowl): the P-51D's x 0.37. Balanced (round 1): 8.883 -> 22.84 a shot, 133.2 -> 342.5 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
