[notes]
# Where each handle's value comes from.
stall_speed = "invented: stall_speed 32.18. the P-51D's x 0.72: Nimble brawler: very low wing loading, light guns."
g_limit = "invented: g_limit 10. Nimble brawler: very low wing loading, light guns."
cruise_speed = "invented: cruise_speed 139.9. the P-51D's x 0.86: Nimble brawler: very low wing loading, light guns."
climb_time = "solved for an initial charge of g x 17.48 m/s; invented: climb_rate 17.48. the P-51D's x 1.15: Nimble brawler: very low wing loading, light guns. Paced: the climb rate 17.48 -> 69.92 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "invented: service_ceiling 10780; the store g h, J/kg. the P-51D's x 0.85: Nimble brawler: very low wing loading, light guns."
low_speed_acceleration = "invented: low_speed_acceleration 3.546. the P-51D's x 1.3: Nimble brawler: very low wing loading, light guns."
sustained_turn_rate = "invented: sustained_turn_rate 22.76; degrees. the P-51D's x 1.45: Nimble brawler: very low wing loading, light guns."
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "invented: roll_rate 133; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. the P-51D's x 1.4: Nimble brawler: very low wing loading, light guns."
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "invented: drag_coefficient 0.01874; rho C_D0 / (2 W/S) with W/S 110.6 kg/m^2 (invented). the P-51D's x 1.15: Nimble brawler: very low wing loading, light guns."
hit_damage = "invented: weight_of_fire 1.362; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Browning .50-class 12.7 mm @ 15/s (cowl): the P-51D's x 0.37. Balanced (round 1): 8.883 -> 22.84 a shot, 133.2 -> 342.5 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 22.84 -> 42.82, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "invented: fire_rate 15; proposal: the main gun's volley rate. the Browning .50-class 12.7 mm"
muzzle_speed = "invented: muzzle_speed 856. the Browning .50-class 12.7 mm"
bullet_spread = "invented: dispersion 4.02; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.67: Nimble brawler: very low wing loading, light guns."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "researched (medium): the .50 cal's, the set's floor (BULLET_DRAG_FLOOR)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 17.48 m/s), the standard fighter's ratio: a shot costs 165.3 J/kg, 0.964 s of charge"
max_shield = "invented: survivability 1; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). No armour; Zero-like. Balanced (round 3): 80 -> 90, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal. Balanced (round 2): 90 -> 100: an invented or placeholder type rated 792 +- 6 in round 1, -265 from the median 1057 (the rule moves its shield 20 towards the median beyond 200 Elo)."
