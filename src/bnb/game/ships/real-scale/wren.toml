muzzle_speed = "invented: muzzle_speed 856. the Browning .50-class 12.7 mm"
bullet_spread = "invented: dispersion 4.02; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.67: Nimble brawler: very low wing loading, light guns."
gun_range = "follows from the bullet life, cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 17.48 m/s), the standard fighter's ratio: a shot costs 165.3 J/kg, 0.964 s of charge"
max_shield = "invented: survivability 1; proposal: the standard 100 x (1 + 0.15 per rating step from the P-51D's 2). No armour; Zero-like. Balanced (round 2): 80 -> 85, the step per rating 0.2 -> 0.15: the shield's Spearman correlation with the round-1 Elo was +0.69 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal. Balanced (round 2): 85 -> 100: an invented or placeholder type rated 792 +- 6 in round 1, -265 from the median 1057 (the rule moves its shield 20 towards the median beyond 200 Elo)."
