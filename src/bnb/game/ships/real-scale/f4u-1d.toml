[notes]
# Where each handle's value comes from.
stall_speed = "researched (good): stall_speed 45.4. wwiiaircraftperformance.org test report; 101.5 mph. Navy test F4U-1 No. 02158, normal fighter 11,194 lb, clean, power off."
g_limit = "researched (medium): g_limit 7.5. recalled standard figure, not re-checked"
cruise_speed = "researched (medium): cruise_speed 155.6. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (348 mph)"
climb_time = "solved for an initial charge of g x 16.5 m/s; researched (good): climb_rate 16.5. sea-level climb, military power: wwiiaircraftperformance.org test report (3250 ft/min)"
ceiling = "researched (good): service_ceiling 11800; the store g h, J/kg. wwiiaircraftperformance.org test report (38700 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 2.913. the research's point-mass model at 1.1 x stall, military power (3.31 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "estimated: sustained_turn_rate 14.7; degrees. the research's point-mass model (16.7 deg/s) x 0.88, its correction for propeller efficiency (no literature value)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "researched (medium): roll_rate 85; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: NACA TR-868 via secondary summaries"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. estimated; note the left-wing-drop stall (stall strip fitted)"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0165; rho C_D0 / (2 W/S) with W/S 186.6 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 3.68; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 6x Browning AN/M2 .50 cal (wing): count x rate x projectile mass. Balanced (round 1): 24 -> 24 a shot, 360 -> 360 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "derived: fire_rate 15; proposal: the main gun's volley rate. the Browning AN/M2 .50 cal: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 856. the Browning AN/M2 .50 cal: AAF Manual 200-1"
bullet_spread = "researched (low): dispersion 6; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "follows from the bullet life, cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 16.5 m/s), the standard fighter's ratio: a shot costs 156.1 J/kg, 0.964 s of charge"
max_shield = "researched (medium): survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Air-cooled radial, pilot armour, self-sealing tanks, strong carrier airframe. Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 6.236. half of the span 12.47 m (40.92 ft)"
