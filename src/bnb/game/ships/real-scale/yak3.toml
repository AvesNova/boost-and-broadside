[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 45.8. W/S 181 kg/m^2 with CLmax ~1.4; 165 km/h."
g_limit = "estimated: g_limit 8. no published value found: the research's estimate"
cruise_speed = "researched (medium): cruise_speed 157.5. sea-level maximum speed, military power: airpages.ru (NII VVS-derived) (567 km/h)"
climb_time = "solved for an initial charge of g x 21 m/s; estimated: climb_rate 21. sea-level climb, military power: 5,000 m in 4.5 min (airpages/Wikipedia). Paced: the climb rate 21 -> 84 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (good): service_ceiling 10400; the store g h, J/kg. Wikipedia"
low_speed_acceleration = "estimated: low_speed_acceleration 4.083. the research's point-mass model at 1.1 x stall, military power (4.64 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (medium): sustained_turn_rate 19.5; degrees. literature: airpages.ru (NII VVS-derived) (360 deg in 18.5 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 100; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: small span, light"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. no published value found: the research's estimate"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0204; rho C_D0 / (2 W/S) with W/S 181.1 kg/m^2 (researched (good)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 2.48; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 1x ShVAK 20 mm (engine); 2x Berezin UBS 12.7 mm (cowl): count x rate x projectile mass. Balanced (round 1): 16.17 -> 23.53 a shot, 242.6 -> 353 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 23.53 -> 44.12, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 15; proposal: the main gun's volley rate. the Berezin UBS 12.7 mm, 1.28 of 2.48 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 850. the Berezin UBS 12.7 mm, 1.28 of 2.48 kg/s: Wikipedia"
bullet_spread = "estimated: dispersion 2.8; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the Berezin UBS 12.7 mm, a .50-class bullet (the floor)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 21 m/s), the standard fighter's ratio: a shot costs 198.6 J/kg, 0.964 s of charge"
max_shield = "researched (medium): survivability 2; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Very light mixed wood/metal structure, liquid-cooled; some pilot armour, protected tanks."
