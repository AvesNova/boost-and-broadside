[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 44.4. W/S 171 kg/m^2 with CLmax ~1.4; 160 km/h."
g_limit = "estimated: g_limit 7.5. no published value found: the research's estimate"
cruise_speed = "estimated: cruise_speed 155.6. sea-level maximum speed, military power: 624 km/h at 6,120 m (Japanese data) less altitude gain (560 km/h)"
climb_time = "solved for an initial charge of g x 18.5 m/s; estimated: climb_rate 18.5. sea-level climb, military power: 5,000 m in 5 min 54 s (Japanese data). Paced: the climb rate 18.5 -> 74 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (medium): service_ceiling 10500; the store g h, J/kg. Wikipedia"
low_speed_acceleration = "estimated: low_speed_acceleration 4.488. the research's point-mass model at 1.1 x stall, military power (5.1 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "estimated: sustained_turn_rate 18.74; degrees. the research's point-mass model (21.3 deg/s) x 0.88, its correction for propeller efficiency (no literature value)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 90; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: no published value found: the research's estimate"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. no published value found: the research's estimate"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.021; rho C_D0 / (2 W/S) with W/S 171.4 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 3.04; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Ho-5 20 mm (wing); 2x Ho-103 12.7 mm (cowl): count x rate x projectile mass. Balanced (round 1): 19.83 -> 23.77 a shot, 297.4 -> 356.6 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 23.77 -> 44.57, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 15; proposal: the main gun's volley rate. the Ho-5 20 mm, 2.13 of 3.04 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 750. the Ho-5 20 mm, 2.13 of 3.04 kg/s: Wikipedia"
bullet_spread = "estimated: dispersion 4.4; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: a light 20 mm shell (Type 99 Mk 2, Ho-5, ShVAK), between the Hispano and the MG 151/20"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 18.5 m/s), the standard fighter's ratio: a shot costs 175 J/kg, 0.964 s of charge"
max_shield = "researched (medium): survivability 3; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Pilot armour and self-sealing tanks, air-cooled radial; but poor build quality late in the war (landing-gear failures, e. Balanced (round 3): 120 -> 110, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
head_on_angle = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 5.62. half of the span 11.24 m"
spawn_energy = "placeholder: the standard fighter's fraction of the store"
