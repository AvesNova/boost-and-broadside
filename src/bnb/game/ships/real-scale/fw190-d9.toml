[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 52.8. same wing, similar weight to the A-8; 190 km/h."
g_limit = "estimated: g_limit 7. as A-8"
cruise_speed = "researched (good): cruise_speed 151.4. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (545 km/h)"
climb_time = "solved for an initial charge of g x 17 m/s; researched (good): climb_rate 17. sea-level climb, military power: wwiiaircraftperformance.org test report (Rechlin, 3,250 rpm, 4,300 kg)"
ceiling = "researched (good): service_ceiling 10500; the store g h, J/kg. wwiiaircraftperformance.org test report (210002 Rpt 1)"
low_speed_acceleration = "estimated: low_speed_acceleration 2.834. the research's point-mass model at 1.1 x stall, military power (3.22 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 16; degrees. literature: simulator/community turn-time compilations (360 deg in 22.5 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "researched (low): roll_rate 130; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: wwiiaircraftperformance.org test report"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 15; degrees. as A-8"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0247; rho C_D0 / (2 W/S) with W/S 233.3 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 2.74; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Rheinmetall-Borsig MG 131 13 mm (cowl); 2x Mauser MG 151/20 (wing_root): count x rate x projectile mass. Balanced (round 1): 26.8 -> 35.47 a shot, 268 -> 354.7 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Mauser MG 151/20, 1.84 of 2.74 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (good): muzzle_speed 805. the Mauser MG 151/20, 1.84 of 2.74 kg/s: Wikipedia"
bullet_spread = "researched (low): dispersion 4; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "follows from the bullet life, cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 17 m/s), the standard fighter's ratio: a shot costs 241.2 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 3; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Liquid-cooled but with an armoured annular radiator; armour as A-8. Balanced (round 3): 120 -> 110, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 5.255. half of the span 10.51 m"
