[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 47.2. W/S 206 kg/m^2 with automatic slats, CLmax ~1.5; 170 km/h."
g_limit = "estimated: g_limit 7. as Fw 190"
cruise_speed = "researched (medium): cruise_speed 165.3. sea-level maximum speed, military power: forum post quoting kurfurst.org (595 km/h)"
climb_time = "solved for an initial charge of g x 22.5 m/s; researched (medium): climb_rate 22.5. sea-level climb, military power: forum post quoting kurfurst.org (1.80 ata; 25 m/s at 1.98 ata; IL-2 museum page gives 20.5 m/s). Paced: the climb rate 22.5 -> 90 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (medium): service_ceiling 12500; the store g h, J/kg. recalled standard figure, not re-checked"
low_speed_acceleration = "estimated: low_speed_acceleration 4.743. the research's point-mass model at 1.1 x stall, military power (5.39 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 17.6; degrees. literature: simulator/community turn-time compilations (360 deg in 20.5 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 100; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: light at low speed, ailerons stiffen markedly above ~450 km/h IAS"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 17; degrees. slats delay the stall"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0236; rho C_D0 / (2 W/S) with W/S 205.6 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 4.31; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 1x Rheinmetall-Borsig MK 108 30 mm (engine); 2x Rheinmetall-Borsig MG 131 13 mm (cowl): count x rate x projectile mass. Balanced (round 1): 42.16 -> 36.29 a shot, 421.6 -> 362.9 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 36.29 -> 68.04, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Rheinmetall-Borsig MK 108 30 mm, 3.41 of 4.31 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 520. the Rheinmetall-Borsig MK 108 30 mm, 3.41 of 4.31 kg/s: Wikipedia"
bullet_spread = "researched (low): dispersion 2.4; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the MK 108 30 mm, a short heavy shell at 500 m/s"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 22.5 m/s), the standard fighter's ratio: a shot costs 319.2 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 2; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Small and light, liquid-cooled with wing radiators; pilot armour and armoured glass; few hits needed."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
head_on_angle = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 4.96. half of the span 9.92 m"
spawn_energy = "placeholder: the standard fighter's fraction of the store"
