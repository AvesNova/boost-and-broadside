# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 43.4. W/S 34.7 lb/sq ft and CLmax ~1.35; 97 mph."
g_limit = "estimated: g_limit 8. as Mk IX"
cruise_speed = "researched (medium): cruise_speed 161.8. sea-level maximum speed, military power: spitfireperformance.com trials (362 mph)"
climb_time = "solved for an initial charge of g x 25.6 m/s; researched (good): climb_rate 25.6. sea-level climb, military power: spitfireperformance.com trials (5040 ft/min). Paced: the climb rate 25.6 -> 102.4 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (medium): service_ceiling 13110; the store g h, J/kg. recalled standard figure, not re-checked (43000 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 4.382. the research's point-mass model at 1.1 x stall, military power (4.98 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "estimated: sustained_turn_rate 18.57; degrees. the research's point-mass model (21.1 deg/s) x 0.88, its correction for propeller efficiency (no literature value)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 90; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: as Mk IX"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. as Mk IX"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0186; rho C_D0 / (2 W/S) with W/S 169.5 kg/m^2 (researched (good)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 3.83; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Hispano Mk II 20 mm (wing); 2x Browning AN/M2 .50 cal (wing): count x rate x projectile mass. Balanced (round 1): 37.47 -> 36.07 a shot, 374.7 -> 360.7 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Hispano Mk II 20 mm, 2.60 of 3.83 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 880. the Hispano Mk II 20 mm, 2.60 of 3.83 kg/s: Wikipedia"
bullet_spread = "estimated: dispersion 4.6; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed (drag scale 1)"
