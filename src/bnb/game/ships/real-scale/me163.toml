[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 44.4. tailless, W/S ~180 kg/m^2 at burnout; 160 km/h."
g_limit = "estimated: g_limit 7. no published value found: the research's estimate"
cruise_speed = "estimated: cruise_speed 230.6. sea-level maximum speed, military power: Mach-limited airframe, ~960 km/h at altitude (830 km/h)"
climb_time = "solved for an initial charge of g x 81.3 m/s; researched (medium): climb_rate 81.3. sea-level climb, military power: Wikipedia (16000 ft/min)"
ceiling = "researched (medium): service_ceiling 12100; the store g h, J/kg. recalled standard figure, not re-checked"
low_speed_acceleration = "estimated: low_speed_acceleration 3.01. the research's point-mass model at 1.1 x stall (no propeller: no correction)"
sustained_turn_rate = "estimated: sustained_turn_rate 19.3; degrees. the research's point-mass model (19.3 deg/s; no propeller, no correction)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 120; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: elevons, very light"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 18; degrees. fixed leading-edge slots give a benign stall"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.016; rho C_D0 / (2 W/S) with W/S 178.6 kg/m^2 (researched (low)). very clean tailless glider-like airframe"
hit_damage = "researched (medium): weight_of_fire 6.82; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Rheinmetall-Borsig MK 108 30 mm (wing_root): count x rate x projectile mass. Balanced (round 1): 66.72 -> 37.13 a shot, 667.2 -> 371.3 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Rheinmetall-Borsig MK 108 30 mm: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 520. the Rheinmetall-Borsig MK 108 30 mm: Wikipedia"
bullet_spread = "estimated: dispersion 2.5; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "follows from the bullet life, cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 81.3 m/s), the standard fighter's ratio: a shot costs 1153 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 1; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Hypergolic T-Stoff/C-Stoff propellants: leaks, hard landings or hits often meant explosion; landed on a skid. Some pilot. Balanced (round 3): 80 -> 90, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
hit_radius = "researched (good): half_span 4.65. half of the span 9.30 m"
spawn_energy = "placeholder: the standard fighter's fraction of the store"
