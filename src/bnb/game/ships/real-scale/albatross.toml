# Where each handle's value comes from.
stall_speed = "invented: stall_speed 35.76. the P-51D's x 0.8: Glider-like energy fighter: very low drag, long wing, weak engine."
g_limit = "invented: g_limit 7. Glider-like energy fighter: very low drag, long wing, weak engine."
cruise_speed = "invented: cruise_speed 149.7. the P-51D's x 0.92: Glider-like energy fighter: very low drag, long wing, weak engine."
climb_time = "solved for an initial charge of g x 12.16 m/s; invented: climb_rate 12.16. the P-51D's x 0.8: Glider-like energy fighter: very low drag, long wing, weak engine. Paced: the climb rate 12.16 -> 48.64 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "invented: service_ceiling 16480; the store g h, J/kg. the P-51D's x 1.3: Glider-like energy fighter: very low drag, long wing, weak engine."
low_speed_acceleration = "invented: low_speed_acceleration 1.637. the P-51D's x 0.6: Glider-like energy fighter: very low drag, long wing, weak engine."
sustained_turn_rate = "invented: sustained_turn_rate 15.7; degrees. the P-51D's x 1.0: Glider-like energy fighter: very low drag, long wing, weak engine. MISSED: the card flies it 4.3% off"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "invented: roll_rate 71.25; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. the P-51D's x 0.75: Glider-like energy fighter: very low drag, long wing, weak engine."
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "invented: drag_coefficient 0.01141; rho C_D0 / (2 W/S) with W/S 150.8 kg/m^2 (invented). the P-51D's x 0.7: Glider-like energy fighter: very low drag, long wing, weak engine."
hit_damage = "invented: weight_of_fire 1.84; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 4x Browning .50-class 12.7 mm @ 10/s (wing): the P-51D's x 0.5. Balanced (round 1): 18 -> 34.77 a shot, 180 -> 347.7 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 34.77 -> 65.2, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "invented: fire_rate 10; proposal: the main gun's volley rate. the Browning .50-class 12.7 mm"
muzzle_speed = "invented: muzzle_speed 856. the Browning .50-class 12.7 mm"
bullet_spread = "invented: dispersion 4.5; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.75: Glider-like energy fighter: very low drag, long wing, weak engine."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "researched (medium): the .50 cal's, the set's floor (BULLET_DRAG_FLOOR)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 12.16 m/s), the standard fighter's ratio: a shot costs 172.5 J/kg, 1.45 s of charge"
max_shield = "invented: survivability 2; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Light structure. Balanced (round 2): 100 -> 120: an invented or placeholder type rated 849 +- 6 in round 1, -208 from the median 1057 (the rule moves its shield 20 towards the median beyond 200 Elo)."
