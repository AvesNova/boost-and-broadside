[notes]
# Where each handle's value comes from.
stall_speed = "invented: stall_speed 55.88. the P-51D's x 1.25: Energy interceptor: a huge engine on a small wing."
g_limit = "invented: g_limit 7. Energy interceptor: a huge engine on a small wing."
cruise_speed = "invented: cruise_speed 179. the P-51D's x 1.1: Energy interceptor: a huge engine on a small wing."
climb_time = "solved for an initial charge of g x 28.88 m/s; invented: climb_rate 28.88. the P-51D's x 1.9: Energy interceptor: a huge engine on a small wing. Paced: the climb rate 28.88 -> 115.5 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "invented: service_ceiling 17750; the store g h, J/kg. the P-51D's x 1.4: Energy interceptor: a huge engine on a small wing."
low_speed_acceleration = "invented: low_speed_acceleration 4.092. the P-51D's x 1.5: Energy interceptor: a huge engine on a small wing."
sustained_turn_rate = "invented: sustained_turn_rate 11.77; degrees. the P-51D's x 0.75: Energy interceptor: a huge engine on a small wing. MISSED: the card flies it 0.7% off"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "invented: roll_rate 80.75; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. the P-51D's x 0.85: Energy interceptor: a huge engine on a small wing."
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "invented: drag_coefficient 0.01548; rho C_D0 / (2 W/S) with W/S 311.6 kg/m^2 (invented). the P-51D's x 0.95: Energy interceptor: a huge engine on a small wing."
hit_damage = "invented: weight_of_fire 3.312; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x MK 108-class 30 mm @ 5/s (nose): the P-51D's x 0.9. Balanced (round 1): 64.8 -> 71.62 a shot, 324 -> 358.1 per second at its 5 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 71.62 -> 134.3, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "invented: fire_rate 5; proposal: the main gun's volley rate. the MK 108-class 30 mm"
muzzle_speed = "invented: muzzle_speed 520. the MK 108-class 30 mm"
bullet_spread = "invented: dispersion 1.74; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.29: Energy interceptor: a huge engine on a small wing."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the MK 108 30 mm, a short heavy shell at 500 m/s"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 28.88 m/s), the standard fighter's ratio: a shot costs 819.5 J/kg, 2.89 s of charge"
max_shield = "invented: survivability 3; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Armoured engine bay, nothing else. Balanced (round 3): 120 -> 110, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal. Balanced (round 3): 110 -> 160: an invented or placeholder type rated 185 +- 11 in round 2, -802 from the median 986 (the rule moves its shield 20 towards the median beyond 200 Elo)."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
head_on_fraction = "placeholder: the standard fighter's"
head_on_angle = "placeholder: the standard fighter's"
