[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 37.5. W/S 127 kg/m^2 with CLmax ~1.45; 135 km/h."
g_limit = "estimated: g_limit 7. light structure, IJN fighter strength requirement"
cruise_speed = "estimated: cruise_speed 130.6. sea-level maximum speed, military power: 565 km/h at 6,000 m less the usual ~95 km/h altitude gain for a single-stage-two-speed engine (470 km/h)"
climb_time = "solved for an initial charge of g x 15.7 m/s; researched (low): climb_rate 15.7. sea-level climb, military power: Wikipedia (Wikipedia gives 15.7 m/s for the A6M2; the A6M5 is similar (6,000 m in ~7 min)). Paced: the climb rate 15.7 -> 62.8 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (medium): service_ceiling 11740; the store g h, J/kg. recalled standard figure, not re-checked"
low_speed_acceleration = "estimated: low_speed_acceleration 4.374. the research's point-mass model at 1.1 x stall, military power (4.97 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 22.5; degrees. literature: simulator/community turn-time compilations (360 deg in 16.0 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "researched (low): roll_rate 80; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: wwiiaircraftperformance.org test report"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. docile stall reported in US tests"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0219; rho C_D0 / (2 W/S) with W/S 126.8 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 2.37; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Type 99 Mk 2 20 mm (wing); 2x Type 97 7.7 mm (cowl): count x rate x projectile mass. Balanced (round 1): 23.18 -> 35.22 a shot, 231.8 -> 352.2 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 35.22 -> 66.03, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Type 99 Mk 2 20 mm, 2.09 of 2.37 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 750. the Type 99 Mk 2 20 mm, 2.09 of 2.37 kg/s: Wikipedia"
bullet_spread = "estimated: dispersion 2.7; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: a light 20 mm shell (Type 99 Mk 2, Ho-5, ShVAK), between the Hispano and the MG 151/20"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 15.7 m/s), the standard fighter's ratio: a shot costs 222.7 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 1; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: No pilot armour and no self-sealing tanks on the A6M5 base model; light structure. Burns easily. Balanced (round 3): 80 -> 90, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard fighter's"
shield_recharge_delay = "placeholder: the standard fighter's"
