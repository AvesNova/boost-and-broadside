[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 52.8. Loftin gives 105 mph, which implies CLmax 1.84 at combat weight and so is almost certainly with Fowler flaps d...; 118 mph."
g_limit = "estimated: g_limit 7.5. AAF pursuit class design (~8 g at design gross), reduced for combat weight above design gross"
cruise_speed = "researched (good): cruise_speed 148. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (331 mph)"
climb_time = "solved for an initial charge of g x 18.1 m/s; researched (medium): climb_rate 18.1. sea-level climb, military power: wwiiaircraftperformance.org test report (3570 ft/min). Paced: the climb rate 18.1 -> 72.4 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (medium): service_ceiling 13410; the store g h, J/kg. Loftin, NASA SP-468 (44000 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 2.587. the research's point-mass model at 1.1 x stall, military power (2.94 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 16.7; degrees. literature: simulator/community turn-time compilations (360 deg in 21.5 s)"
half_lift_drag = "placeholder: the standard heavy's"
nose_reversal_time = "researched (low): roll_rate 90; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: recalled standard figure, not re-checked"
dive_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. NACA 23016/23009 wing"
vision_range = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "researched (medium): drag_coefficient 0.0268; rho C_D0 / (2 W/S) with W/S 253.4 kg/m^2 (researched (medium)). recalled standard figure, not re-checked"
hit_damage = "researched (medium): weight_of_fire 3.86; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 1x AN/M2 20 mm (nose); 4x Browning AN/M2 .50 cal (nose): count x rate x projectile mass. Balanced (round 1): 25.17 -> 24.06 a shot, 377.6 -> 360.9 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
fire_rate = "derived: fire_rate 15; proposal: the main gun's volley rate. the Browning AN/M2 .50 cal, 2.45 of 3.86 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 856. the Browning AN/M2 .50 cal, 2.45 of 3.86 kg/s: AAF Manual 200-1"
bullet_spread = "researched (low): dispersion 3.6; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed (drag scale 1)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 18.1 m/s), the standard fighter's ratio: a shot costs 171.2 J/kg, 0.964 s of charge"
max_shield = "researched (medium): survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Two engines: could return on one. Pilot armour, self-sealing tanks. Against it: liquid-cooled engines and turbochargers . Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard heavy's"
shield_recharge_delay = "placeholder: the standard heavy's"
head_on_fraction = "placeholder: the standard heavy's"
head_on_angle = "placeholder: the standard heavy's"
hit_radius = "researched (good): half_span 7.925. half of the span 15.85 m (52 ft)"
spawn_energy = "placeholder: the standard heavy's fraction of the store"
