[notes]
# Where each handle's value comes from.
stall_speed = "invented: stall_speed 49.17. the P-51D's x 1.1: Rocket sprinter: enormous thrust, a tiny store (propellant)."
g_limit = "invented: g_limit 8. Rocket sprinter: enormous thrust, a tiny store (propellant)."
cruise_speed = "invented: cruise_speed 235.9. the P-51D's x 1.45: Rocket sprinter: enormous thrust, a tiny store (propellant). MISSED: the card flies it 1.9% off"
climb_time = "solved for an initial charge of g x 60.8 m/s; invented: climb_rate 60.8. the P-51D's x 4.0: Rocket sprinter: enormous thrust, a tiny store (propellant). Paced: the climb rate 60.8 -> 243.2 m/s, x 4 (docs/explanation/game/real-scale-pacing.md). MISSED: the card flies it 2.3% off"
ceiling = "invented: service_ceiling 3170; the store g h, J/kg. the P-51D's x 0.25: Rocket sprinter: enormous thrust, a tiny store (propellant)."
low_speed_acceleration = "invented: low_speed_acceleration 8.184. the P-51D's x 3.0: Rocket sprinter: enormous thrust, a tiny store (propellant). MISSED: the card flies it 26.7% off"
sustained_turn_rate = "invented: sustained_turn_rate 15.7; degrees. the P-51D's x 1.0: Rocket sprinter: enormous thrust, a tiny store (propellant). MISSED: the card flies it 3.7% off"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "invented: roll_rate 114; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. the P-51D's x 1.2: Rocket sprinter: enormous thrust, a tiny store (propellant). MISSED: the card flies it 2.7% off"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D. Paced: 10.9 -> 13.73 m/s^2, the paced coast exchange 10.11 plus half the P-51D's paced boost exchange (docs/explanation/game/real-scale-pacing.md). MISSED: the card flies it 1.4% off"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D MISSED: the card flies it 2.4% off"
stall_angle = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "invented: drag_coefficient 0.01467; rho C_D0 / (2 W/S) with W/S 241.2 kg/m^2 (invented). the P-51D's x 0.9: Rocket sprinter: enormous thrust, a tiny store (propellant)."
hit_damage = "invented: weight_of_fire 3.312; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x MK 108-class 30 mm @ 5/s (wing_root): the P-51D's x 0.9. Balanced (round 1): 64.8 -> 71.62 a shot, 324 -> 358.1 per second at its 5 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 71.62 -> 134.3, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "invented: fire_rate 5; proposal: the main gun's volley rate. the MK 108-class 30 mm"
muzzle_speed = "invented: muzzle_speed 520. the MK 108-class 30 mm"
bullet_spread = "invented: dispersion 2.52; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.42: Rocket sprinter: enormous thrust, a tiny store (propellant)."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the MK 108 30 mm, a short heavy shell at 500 m/s"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 60.8 m/s), the standard fighter's ratio: a shot costs 1725 J/kg, 2.89 s of charge"
max_shield = "invented: survivability 1; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Explosive propellants. Balanced (round 3): 80 -> 90, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal. Balanced (round 3): 90 -> 120: an invented or placeholder type rated -867 +- 24 in round 2, -1854 from the median 986 (the rule moves its shield 20 towards the median beyond 200 Elo)."
shield_recharge_rate = "placeholder: the standard fighter's"
