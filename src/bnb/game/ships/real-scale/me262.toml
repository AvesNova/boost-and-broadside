[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 55.6. W/S 295 kg/m^2 with automatic slats, CLmax ~1.45; 200 km/h."
g_limit = "estimated: g_limit 7. no published value found: the research's estimate"
cruise_speed = "researched (medium): cruise_speed 227.8. sea-level maximum speed, military power: recalled standard figure, not re-checked (820 km/h)"
climb_time = "solved for an initial charge of g x 20 m/s; researched (medium): climb_rate 20. sea-level climb, military power: Wikipedia (At 7,130 kg max weight). Paced: the climb rate 20 -> 80 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (good): service_ceiling 11450; the store g h, J/kg. Wikipedia"
low_speed_acceleration = "estimated: low_speed_acceleration 1.76. the research's point-mass model at 1.1 x stall (no propeller: no correction)"
sustained_turn_rate = "estimated: sustained_turn_rate 14.1; degrees. the research's point-mass model (14.1 deg/s; no propeller, no correction)"
half_lift_drag = "placeholder: the standard heavy's"
nose_reversal_time = "estimated: roll_rate 60; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: long span with engines out on the wing"
dive_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 17; degrees. slats"
vision_range = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0191; rho C_D0 / (2 W/S) with W/S 294.9 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 13.64; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Rheinmetall-Borsig MK 108 30 mm (nose); 2x Rheinmetall-Borsig MK 108 30 mm (nose): count x rate x projectile mass. Balanced (round 1): 133.4 -> 37.8 a shot, 1334 -> 378 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 37.8 -> 70.88, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Rheinmetall-Borsig MK 108 30 mm: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 520. the Rheinmetall-Borsig MK 108 30 mm: Wikipedia"
bullet_spread = "estimated: dispersion 1.8; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the MK 108 30 mm, a short heavy shell at 500 m/s"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 20 m/s), the standard fighter's ratio: a shot costs 283.7 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 3; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Unarmoured jets that flamed out or caught fire; pilot armour and self-sealing tanks; very vulnerable at take-off/landing. Balanced (round 3): 120 -> 110, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
shield_recharge_rate = "placeholder: the standard heavy's"
