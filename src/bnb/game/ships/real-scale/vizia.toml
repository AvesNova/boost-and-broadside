[notes]
# Where each handle's value comes from.
stall_speed = "researched (medium): stall_speed 44.7. Loftin, NASA SP-468; 100 mph. Loftin: stalling speed 100 mph (at ~10,100 lb gross). At 9,600 lb this scales to ~97.5 mph; 100 kept as the published figure."
g_limit = "researched (medium): g_limit 8. recalled standard figure, not re-checked"
cruise_speed = "researched (good): cruise_speed 162.7. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (364 mph)"
climb_time = "solved for an initial charge of g x 15.2 m/s; estimated: climb_rate 15.2. sea-level climb, military power: NAA calc. NA-46-130 gives 3,410 ft/min at WEP (67 in); military (61 in, ~230 hp less) scaled by excess power t... (3000 ft/min). Paced: the climb rate 15.2 -> 60.8 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (good): service_ceiling 12680; the store g h, J/kg. wwiiaircraftperformance.org test report (41600 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 2.728. the research's point-mass model at 1.1 x stall, military power (3.1 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "flight realism (2026-11-13, game v8): 15.70 -> 18.70 -> 21.30 deg/s (game v10), so the middle stick (0.7) settles near 87 m/s, the best sustained turn's region (WWII best sustained turn 70-97 m/s at 14-20 deg/s) under the direct charge and the drag rise"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 15.5; degrees. NACA 45-100 laminar section, clean CLmax ~1.4; typical fuselage-reference stall angle 15-17 deg"
vision_range = "derived: the standard 1024 m times the map scale (3)"
zero_lift_drag = "researched (good): drag_coefficient 0.0163; rho C_D0 / (2 W/S) with W/S 201 kg/m^2 (researched (medium)). Loftin, NASA SP-468"
hit_damage = "researched (medium): weight_of_fire 3.68; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 6x Browning AN/M2 .50 cal (wing): count x rate x projectile mass. Balanced (round 1): 24 -> 24 a shot, 360 -> 360 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 8 -> 15, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance. the game loop's tuning (docs/rewrite/sections/game-loop/progress.md): 15 -> 9.75 (hit damage x 0.65 restores v5's damage per landed hit)"
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 15; proposal: the main gun's volley rate. the Browning AN/M2 .50 cal: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 856. the Browning AN/M2 .50 cal: AAF Manual 200-1"
bullet_spread = "researched (low): dispersion 6; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "follows from the bullet life, cruise and muzzle speed (drag scale 1)"
bullet_drag = "researched (medium): the .50 cal's, the set's floor (BULLET_DRAG_FLOOR)"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 15.2 m/s), the standard fighter's ratio: a shot costs 143.8 J/kg, 0.964 s of charge"
max_shield = "researched (medium): survivability 2; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Liquid-cooled Merlin with a ventral radiator and long coolant lines: one hit can end the flight. Pilot armour and self-s"
