max_shield = "invented: survivability 5; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Armoured engine, cockpit and tanks (Il-2 style). Balanced (round 3): 160 -> 130, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal. Balanced (round 3): 130 -> 160: an invented or placeholder type rated -84 +- 13 in round 2, -1070 from the median 986 (the rule moves its shield 20 towards the median beyond 200 Elo)."
