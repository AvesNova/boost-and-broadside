hit_damage = "invented: weight_of_fire 2.723; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 1x Vickers S-class 40 mm @ 2/s (nose); 2x Browning .50-class 12.7 mm (ranging) @ 6/s (nose): the P-51D's x 0.74. Balanced (round 1): 133.2 -> 177.3 a shot, 266.4 -> 354.6 per second at its 2 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings)."
