muzzle_speed = "invented: muzzle_speed 615. the Vickers S-class 40 mm, 2.16 of 2.71 kg/s"
bullet_spread = "invented: dispersion 2.4; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.4: Heavy gunship: one big slow cannon, armoured bathtub."
