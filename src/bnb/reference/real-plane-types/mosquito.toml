# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 49.2. W/S 43 lb/sq ft and CLmax ~1.4; 110 mph."
g_limit = "estimated: g_limit 6. fighter-bomber/light-bomber strength class"
cruise_speed = "researched (good): cruise_speed 148.4. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (332 mph)"
climb_time = "solved for an initial charge of g x 10.2 m/s; estimated: climb_rate 10.2. sea-level climb, military power: A&AEE HJ.679 at 21,020 lb gives 1,740 ft/min at 10,400 ft in M.S. gear; lighter combat weight and SL density (2000 ft/min). Paced: the climb rate 10.2 -> 40.8 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (good): service_ceiling 9083; the store g h, J/kg. wwiiaircraftperformance.org test report (29800 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 2.816. the research's point-mass model at 1.1 x stall, military power (3.2 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "estimated: sustained_turn_rate 14.96; degrees. the research's point-mass model (17.0 deg/s) x 0.88, its correction for propeller efficiency (no literature value)"
half_lift_drag = "placeholder: the standard heavy's"
nose_reversal_time = "estimated: roll_rate 60; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: large twin with heavy roll inertia"
dive_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 15; degrees. no published value found: the research's estimate"
vision_range = "placeholder: the standard heavy's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0215; rho C_D0 / (2 W/S) with W/S 209.7 kg/m^2 (estimated). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 6.07; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 4x Hispano Mk II 20 mm (nose); 4x .303 Browning Mk II (nose): count x rate x projectile mass. Balanced (round 1): 59.38 -> 36.91 a shot, 593.8 -> 369.1 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 36.91 -> 69.21, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Hispano Mk II 20 mm, 5.20 of 6.07 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 880. the Hispano Mk II 20 mm, 5.20 of 6.07 kg/s: Wikipedia"
bullet_spread = "estimated: dispersion 3.1; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the Hispano 20 mm, a heavier shell than the .50's at a like ballistic coefficient"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 10.2 m/s), the standard fighter's ratio: a shot costs 144.7 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 3; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Two engines; wooden structure absorbs hits but burns and was hard to repair; little armour beyond the crew bulkhead; coo. Balanced (round 3): 120 -> 110, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
