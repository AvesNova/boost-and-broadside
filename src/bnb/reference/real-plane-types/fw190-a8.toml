[notes]
# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 52.8. W/S 225 kg/m^2 and CLmax ~1.4 gives 184 km/h; RAE noted a sharp wing drop at the stall; 190 km/h."
g_limit = "estimated: g_limit 7. German strength group H5 safe load factor ~ 7 at design weight; not found tonight"
cruise_speed = "researched (good): cruise_speed 154.7. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (557 km/h)"
climb_time = "solved for an initial charge of g x 14.4 m/s; researched (good): climb_rate 14.4. sea-level climb, military power: wwiiaircraftperformance.org test report (GL/C-E2 Nr 7578/44 (13.4 m/s in the 13.11.43 chart)). Paced: the climb rate 14.4 -> 57.6 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (low): service_ceiling 10300; the store g h, J/kg. recalled standard figure, not re-checked"
low_speed_acceleration = "estimated: low_speed_acceleration 2.807. the research's point-mass model at 1.1 x stall, military power (3.19 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 15.7; degrees. literature: simulator/community turn-time compilations (360 deg in 23.0 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "researched (medium): roll_rate 150; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: NACA TR-868 via secondary summaries"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 15; degrees. NACA 23015.3-23009 section"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0225; rho C_D0 / (2 W/S) with W/S 229.5 kg/m^2 (researched (medium)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 4.95; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 2x Rheinmetall-Borsig MG 131 13 mm (cowl); 2x Mauser MG 151/20 (wing_root); 2x Mauser MG 151/20 (wing): count x rate x projectile mass. Balanced (round 1): 48.42 -> 36.54 a shot, 484.2 -> 365.4 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 36.54 -> 68.51, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 10; proposal: the main gun's volley rate. the Mauser MG 151/20, 4.05 of 4.95 kg/s: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (good): muzzle_speed 805. the Mauser MG 151/20, 4.05 of 4.95 kg/s: Wikipedia"
bullet_spread = "researched (low): dispersion 4; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the MG 151/20 high-explosive (Minengeschoss) shell, light and blunt"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 14.4 m/s), the standard fighter's ratio: a shot costs 204.3 J/kg, 1.45 s of charge"
max_shield = "researched (medium): survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Air-cooled radial in front of the pilot, armoured oil cooler ring, self-sealing tanks; A-8 added heavier cockpit armour . Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
