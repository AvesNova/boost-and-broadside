# Where each handle's value comes from.
stall_speed = "estimated: stall_speed 45.2. W/S 37.7 lb/sq ft with CLmax ~1.45; 101 mph."
g_limit = "estimated: g_limit 8. no published value found: the research's estimate"
cruise_speed = "researched (good): cruise_speed 168.1. sea-level maximum speed, military power: wwiiaircraftperformance.org test report (376 mph)"
climb_time = "solved for an initial charge of g x 22.3 m/s; researched (good): climb_rate 22.3. sea-level climb, military power: wwiiaircraftperformance.org test report (4380 ft/min). Paced: the climb rate 22.3 -> 89.2 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
ceiling = "researched (good): service_ceiling 10360; the store g h, J/kg. wwiiaircraftperformance.org test report (34000 ft)"
low_speed_acceleration = "estimated: low_speed_acceleration 3.546. the research's point-mass model at 1.1 x stall, military power (4.03 m/s^2) x 0.88, its correction for propeller efficiency"
sustained_turn_rate = "researched (low): sustained_turn_rate 15.7; degrees. literature: simulator/community turn-time compilations (360 deg in 23.0 s)"
half_lift_drag = "placeholder: the standard fighter's"
nose_reversal_time = "estimated: roll_rate 100; the P-51D's nose reversal (a placeholder) x its roll rate 95 over this one. peak roll rate: spring-tab ailerons; AFDU/CFE trials rate it better than the Spitfire XIV at speed, worse than the Fw 190"
dive_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zoom_acceleration = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
stall_angle = "estimated: stall_angle 16; degrees. thin semi-elliptical wing (14.5% root, 10% tip)"
vision_range = "placeholder: the standard fighter's, scaled as the standard fighter is to the P-51D"
zero_lift_drag = "estimated: drag_coefficient 0.0151; rho C_D0 / (2 W/S) with W/S 184.3 kg/m^2 (researched (good)). back-solved so the point-mass model (propeller efficiency 0.8, Oswald 0.8) reaches the measured sea-level mili..."
hit_damage = "researched (medium): weight_of_fire 6.5; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 4x Hispano Mk V 20 mm (wing): count x rate x projectile mass. Balanced (round 1): 42.39 -> 24.69 a shot, 635.9 -> 370.4 per second at its 15 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 24.69 -> 46.3, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "derived: fire_rate 15; proposal: the main gun's volley rate. the Hispano Mk V 20 mm: the whole-Hz volley rate dividing 30 nearest its rate per gun"
muzzle_speed = "researched (medium): muzzle_speed 840. the Hispano Mk V 20 mm: Wikipedia"
bullet_spread = "estimated: dispersion 4; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the volley's 75% cone (mil), weight-of-fire-weighted over the gun groups, installed"
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the Hispano 20 mm, a heavier shell than the .50's at a like ballistic coefficient"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 22.3 m/s), the standard fighter's ratio: a shot costs 210.9 J/kg, 0.964 s of charge"
max_shield = "researched (medium): survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). 1 fragile - 5 very tough: Big, strongly built; pilot armour. Chin radiator and liquid cooling are vulnerable, but the airframe absorbs a lot. Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
