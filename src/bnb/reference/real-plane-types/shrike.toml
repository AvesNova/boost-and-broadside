zero_lift_drag = "invented: drag_coefficient 0.01793; rho C_D0 / (2 W/S) with W/S 231.1 kg/m^2 (invented). the P-51D's x 1.1: Roll-and-dive slasher (Fw 190 vibe)."
hit_damage = "invented: weight_of_fire 4.416; proposal: 360 per second (the P-51D's) x the weight of fire over the P-51D's 3.68 kg/s, over the fire rate. 4x MG 151/20-class 20 mm @ 10/s (wing_root); 2x MG 131-class 13 mm @ 10/s (cowl): the P-51D's x 1.2. Balanced (round 1): 43.2 -> 36.33 a shot, 432 -> 363.3 per second at its 10 Hz: the equal-damage rule, 360 x (its weight of fire over the P-51D's)^0.05 within 5% (the guns dominated the ratings). Centre hit (game v6): 36.33 -> 68.12, x 15/8 (the closeness's mean over a uniform impact parameter is 8/15), at the reference distance."
explosive_share = "proposal: the default, pure kinetic"
fire_rate = "invented: fire_rate 10; proposal: the main gun's volley rate. the MG 151/20-class 20 mm, 3.68 of 4.40 kg/s"
muzzle_speed = "invented: muzzle_speed 805. the MG 151/20-class 20 mm, 3.68 of 4.40 kg/s"
bullet_spread = "invented: dispersion 3.72; sigma = D75 / (2 x 1.665) x the muzzle speed; gun spacing ignored (nose guns, no convergence). the P-51D's x 0.62: Roll-and-dive slasher (Fw 190 vibe)."
gun_range = "the reach in the set's gun flight time (0.6 s), cruise and muzzle speed, under RANGE_DRAG (the set's drag before game v6)"
bullet_drag = "estimated: the MG 151/20 high-explosive (Minengeschoss) shell, light and blunt"
shots_per_store = "proposal: continuous fire costs 14.5 x the initial climb charge (g x 15.2 m/s), the standard fighter's ratio: a shot costs 215.6 J/kg, 1.45 s of charge"
max_shield = "invented: survivability 4; proposal: the standard 100 x (1 + 0.1 per rating step from the P-51D's 2). Radial engine in front, armour. Balanced (round 3): 140 -> 120, the step per rating 0.2 -> 0.1: the shield's Spearman correlation with the round-2 Elo was +0.54 (the rule moves the step at |rho| >= 0.4); the survivability ratings are estimates and the step a proposal."
