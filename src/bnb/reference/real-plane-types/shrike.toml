climb_time = "solved for an initial charge of g x 15.2 m/s; invented: climb_rate 15.2. the P-51D's x 1.0: Roll-and-dive slasher (Fw 190 vibe). Paced: the climb rate 15.2 -> 60.8 m/s, x 4 (docs/explanation/game/real-scale-pacing.md)."
