; /etc/supervisor/conf.d/bnb-hf-backup.conf: the Hugging Face backup loop (every 30 minutes).
; autostart=false: start it by hand once HF_TOKEN is in /workspace/secrets.env.
[program:bnb-hf-backup]
command=/workspace/hf-backup/hf_backup_loop.sh
autostart=false
autorestart=true
stdout_logfile=/workspace/logs/hf_backup.supervisor.log
redirect_stderr=true
