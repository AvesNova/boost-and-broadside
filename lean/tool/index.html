<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B&amp;B tool</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #fcfcfb; color: #0b0b0b; }
  nav { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #e7e6e2; }
  nav button { padding: 6px 14px; border: 1px solid #c3c2b7; background: #fff; cursor: pointer; }
  nav button.on { background: #2a78d6; color: #fff; border-color: #2a78d6; }
  #ships { display: none; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; padding: 12px; }
  #ships.on { display: grid; }
  @media (max-width: 760px) { #ships { grid-template-columns: 1fr; padding: 8px 16px; } }
  #controls label { display: block; margin-top: 8px; }
  #controls input[type=range] { width: 100%; }
  #controls .value { float: right; font-variant-numeric: tabular-nums; color: #52514e; }
  #controls .off { color: #898781; }
  #controls details { border-top: 1px solid #e7e6e2; padding: 4px 0; }
  #controls summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  #controls .switch { margin-right: 6px; vertical-align: -2px; }
  #charts img { width: 100%; max-width: 720px; display: block; margin-bottom: 12px; }
  #drawn { color: #52514e; min-height: 1.2em; }
  table { border-collapse: collapse; margin: 8px 0; }
  td { padding: 2px 12px 2px 0; font-variant-numeric: tabular-nums; }
  td.name { color: #52514e; }
  #error { color: #c0392b; min-height: 1.2em; }
  #sandbox { display: none; position: relative; }
  #sandbox.on { display: block; }
  canvas { display: block; width: 100vw; height: calc(100vh - 50px); background: #0d1117; }
  #hud { position: absolute; left: 10px; top: 10px; color: #d8dee9; font: 12px ui-monospace, monospace;
         background: #161b22cc; padding: 8px 10px; white-space: pre; pointer-events: none; }
  #status { position: absolute; left: 10px; bottom: 10px; color: #8b949e; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<nav><button id="tab-ships" class="on">Ships</button><button id="tab-sandbox">Sandbox</button></nav>

<div id="ships" class="on">
  <div id="controls">
    <label>Preset <select id="preset"></select></label>
    <label>Time scale <select id="factor">
      <option value="1">1x real time</option><option value="1.5">1.5x</option>
      <option value="2" selected>2x (the game)</option><option value="3">3x</option></select></label>
    <label>Units <select id="units"></select></label>
    <p><input id="savename" placeholder="name" size="14"> <button id="save">Save</button> <button id="delete">Delete</button></p>
    <p><button id="reset">Reset to preset</button> <button id="fly">Fly checks</button></p>
    <div id="drawn"></div>
    <div id="error"></div>
    <table id="readouts"></table>
    <div id="sliders"></div>
  </div>
  <div id="charts"><img id="doghouse" alt="doghouse (drawing...)"><img id="sustained" alt="sustained turn (drawing...)"></div>
</div>

<div id="sandbox">
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="status">arrows/WASD turn (shift sustained, ctrl fine) / up dive / down climb / space fire / C opponent / R reset / +- zoom</div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEG = 180 / Math.PI;
let unitInfo = null, saved = {}, controlsByName = {}, presets = null, values = {}, off = new Set(), last = null, timer = null, sequence = 0;

// ---- tabs
function show(tab) {
  for (const t of ["ships", "sandbox"]) { $(t).classList.toggle("on", t === tab); $("tab-" + t).classList.toggle("on", t === tab); }
  if (tab === "sandbox") startSandbox(); else stopSandbox();
}
$("tab-ships").onclick = () => show("ships");
$("tab-sandbox").onclick = () => show("sandbox");

// ---- ships tab: the inputs come from the server (lean.tool.design.inputs: the tuning's own list)
async function init() {
  const data = await (await fetch("/api/presets")).json();
  presets = data.presets; unitInfo = data.units;
  for (const name of unitInfo.order) $("units").add(new Option(unitInfo.names[name], name));
  await loadSaved();
  $("preset").onchange = () => choosePreset();
  $("save").onclick = saveState;
  $("delete").onclick = deleteSaved;
  $("factor").onchange = $("units").onchange = () => { refreshAll(); request(); };
  $("reset").onclick = () => choosePreset();
  $("fly").onclick = flyChecks;
  choosePreset();
}
// ---- units (the factors come from the server's lean.tool.units): the solve and the saved presets
// stay in game units; sliders, readouts and the HUD convert for display and back
const scaleOf = kind => { const d = unitInfo.systems[$("units").value][kind]; return d.scale * Math.pow(+$("factor").value, -d.time_power); };
const unitLabel = kind => unitInfo.systems[$("units").value][kind].label;
const shown = (kind, game, digits = 0) => `${(game * scaleOf(kind)).toFixed(digits)} ${unitLabel(kind)}`;
function refreshControl(c) {                             // the slider and its label in the shown units
  const s = c.spec, k = s.kind ? scaleOf(s.kind) : 1;
  c.input.min = s.low * k; c.input.max = s.high * k; c.input.step = (s.high - s.low) * k / 400; c.input.value = c.game * k;
  c.out.textContent = (c.game * k).toPrecision(4);
  const unit = s.kind ? unitLabel(s.kind) : s.unit;
  c.name.textContent = s.label + (unit ? ` (${unit})` : "");
}
function refreshAll() { for (const c of Object.values(controlsByName)) refreshControl(c); }
const base = () => { const v = $("preset").value; return v.startsWith("saved:") ? saved[v.slice(6)].state.preset : v; };
async function loadSaved(select) {
  saved = {};
  for (const r of (await (await fetch("/api/saved")).json()).saved) saved[r.name] = r;
  $("preset").innerHTML = "";
  for (const name of Object.keys(presets)) $("preset").add(new Option(name, name));
  for (const name of Object.keys(saved)) $("preset").add(new Option("saved: " + name, "saved:" + name));
  if (select) $("preset").value = select;
}
async function saveState() {
  const name = $("savename").value.trim();
  if (!name) { $("error").textContent = "type a name first"; return; }
  const safe = name.replace(/[^A-Za-z0-9._-]/g, "_");
  if (saved[safe] && !confirm(`A saved preset "${safe}" exists. Overwrite?`)) return;
  const state = JSON.parse(body());
  const response = await post("/api/saved", JSON.stringify({ name, state }));
  if (!response.ok) { $("error").textContent = "save failed: " + (await response.json()).error; return; }
  await loadSaved("saved:" + (await response.json()).name);
  $("error").textContent = "";
}
async function deleteSaved() {
  const v = $("preset").value;
  if (!v.startsWith("saved:")) { $("error").textContent = "choose a saved preset to delete"; return; }
  const name = v.slice(6);
  if (!confirm(`Delete saved preset "${name}"?`)) return;
  await fetch("/api/saved/" + encodeURIComponent(name), { method: "DELETE" });
  await loadSaved(); choosePreset();
}
function choosePreset() {
  const v = $("preset").value, state = v.startsWith("saved:") ? saved[v.slice(6)].state : null;
  const inputs = presets[base()].inputs;
  controlsByName = {};
  $("sliders").innerHTML = "";
  values = {}; off = new Set();                           // only moved inputs are sent
  const groups = {};
  for (const s of inputs) {
    if (!groups[s.group]) {
      const box = document.createElement("details");
      box.open = Object.keys(groups).length < 2;
      box.innerHTML = `<summary>${s.group}</summary>`;
      $("sliders").appendChild(box); groups[s.group] = box;
    }
    const label = document.createElement("label");
    const input = document.createElement("input");
    Object.assign(input, { type: "range", min: s.low, max: s.high, step: (s.high - s.low) / 400, value: s.value });
    label.innerHTML = `<span class="name"></span> <span class="value"></span>`;
    const out = label.querySelector(".value");
    const control = { spec: s, input, out, name: label.querySelector(".name"), game: s.value, box: null };
    input.oninput = () => {                               // shown units back to the game's
      control.game = +input.value / (s.kind ? scaleOf(s.kind) : 1);
      values[s.name] = control.game; out.textContent = (+input.value).toPrecision(4); schedule();
    };
    if (s.switch) {                                        // a term that can be turned off
      const box = document.createElement("input");
      Object.assign(box, { type: "checkbox", checked: s.switch.on, className: "switch", title: s.switch.label });
      const apply = () => {
        if (box.checked) off.delete(s.name); else off.add(s.name);
        input.disabled = !box.checked; label.classList.toggle("off", !box.checked);
      };
      box.onchange = () => { apply(); schedule(); };
      apply();
      label.prepend(box);
    }
    control.box = s.switch ? label.querySelector(".switch") : null;
    controlsByName[s.name] = control;
    label.appendChild(input); groups[s.group].appendChild(label);
  }
  if (state) {                                             // restore a saved state (game units)
    $("factor").value = String(state.time_scale);
    $("units").value = state.units === "real" ? "real_metric" : (state.units || "game");
    for (const [n, x] of Object.entries(state.values || {})) {
      const c = controlsByName[n]; if (!c) continue;
      c.game = +x; values[n] = +x;
    }
    for (const n of state.off || []) {
      const c = controlsByName[n]; if (c && c.box) { c.box.checked = false; c.box.onchange(); }
    }
  }
  refreshAll();
  request();
}
function schedule() { clearTimeout(timer); timer = setTimeout(request, 250); }   // debounced
function body() {
  return JSON.stringify({ preset: base(), values, off: [...off], time_scale: +$("factor").value,
                          units: $("units").value });
}
function post(url, payload) { return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: payload }); }
const pngUrls = {};
async function showPng(id, response) {
  const url = URL.createObjectURL(await response.blob());
  if (pngUrls[id]) URL.revokeObjectURL(pngUrls[id]);
  pngUrls[id] = url; $(id).src = url;
}
async function request() {
  const mine = ++sequence, payload = body(), began = performance.now();
  $("drawn").textContent = "drawing...";
  const [numbers, dog, held] = await Promise.all([post("/api/envelope", payload), post("/api/doghouse.png", payload),
                                                  post("/api/sustained.png", payload)]);
  if (mine !== sequence) return;                          // a newer request is under way
  if (!numbers.ok) {
    $("error").textContent = "No solution for these inputs: " + (await numbers.json()).error;
    $("drawn").textContent = "";
    return;
  }
  $("error").textContent = "";
  last = await numbers.json();
  if (dog.ok) await showPng("doghouse", dog);
  if (held.ok) await showPng("sustained", held);
  readouts();
  $("drawn").textContent = `drawn in ${((performance.now() - began) / 1000).toFixed(2)} s; lowest speeds ` +
    (last.design.lowest_source === "flown" ? "flown for this design" : "estimated (Fly checks flies this design)");
}
async function flyChecks() {
  $("drawn").textContent = "flying the checks in the game (about 10 s)...";
  $("fly").disabled = true;
  const response = await post("/api/flown", body());
  $("fly").disabled = false;
  if (!response.ok) { $("error").textContent = "No solution for these inputs: " + (await response.json()).error; return; }
  await request();
}
function readouts() {
  const key = last.design.key, check = last.design.flown;
  const speed = v => shown("speed", v), rate = r => `${(r * scaleOf("angular_rate")).toFixed(1)} deg/s`;
  const pair = (v, r) => `${speed(v)} / ${rate(r)}`;
  const flownPair = name => (check && check[name] ? ` (flown ${pair(check[name].speed, check[name].rate)})` : "");
  const tight = check && check.tightest_sustained;
  const rows = [
    ["corner speed / rate", pair(key.corner_speed, key.corner_rate) + flownPair("corner")],
    ["best sustained speed / rate", key.best_sustained_speed === null ? "none"
      : pair(key.best_sustained_speed, key.best_sustained_rate) + flownPair("best_sustained")],
    ["tightest sustained radius / at", key.tightest_sustained_radius === null ? "none"
      : `${shown("length", key.tightest_sustained_radius)} / ${speed(key.tightest_sustained_speed)}` +
        (tight ? ` (flown ${shown("length", tight.radius)} / ${speed(tight.speed)})` : "")],
    ["speed gap (tightest - best rate)", key.best_sustained_speed === null ? "-"
      : speed(key.tightest_sustained_speed - key.best_sustained_speed)],
    ["top speed", speed(key.top_speed)],
    ["best climb (Ps) / at", `${shown("climb", key.best_climb, $("units").value === "real_imperial" ? 0 : 1)} / ${speed(key.best_climb_speed)}`],
    ["stall speed (1 g)", speed(key.stall_speed)],
  ];
  $("readouts").innerHTML = rows.map(r => `<tr><td class="name">${r[0]}</td><td>${r[1]}</td></tr>`).join("");
}

// ---- sandbox tab
const canvas = $("view"), g = canvas.getContext("2d");
let socket = null, setup = null, prev = null, cur = null, curAt = 0, zoom = 0.6, trail = [];
const keys = new Set();
function stopSandbox() { if (socket) { socket.close(); socket = null; } }
function startSandbox() {
  stopSandbox(); prev = cur = null; trail = [];
  const ws = new WebSocket(`ws://${location.host}/api/sandbox`);
  socket = ws;
  ws.onopen = () => ws.send(JSON.stringify({ preset: base(), values, off: [...off], time_scale: +$("factor").value, opponent: true }));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "setup") { setup = m; trail = []; }
    else if (m.type === "error") $("status").textContent = "no solution for these inputs: " + m.message;
    else if (m.type === "frame") { prev = cur; cur = m; curAt = performance.now(); trail.push([m.ships[0].x, m.ships[0].y]); if (trail.length > 150) trail.shift(); }
  };
  ws.onclose = () => { if (socket === ws) socket = null; };
}
function send(o) { if (socket && socket.readyState === 1) socket.send(JSON.stringify(o)); }
function controls() {
  const left = keys.has("ArrowLeft") || keys.has("a"), right = keys.has("ArrowRight") || keys.has("d");
  const dive = keys.has("ArrowUp") || keys.has("w"), climb = keys.has("ArrowDown") || keys.has("s");
  return { side: +left - +right, level: keys.has("Control") ? 1 : keys.has("Shift") ? 2 : 3,
           power: dive && !climb ? 1 : climb && !dive ? 2 : 0, fire: keys.has(" ") };
}
let sent = "";
function sync() { const c = JSON.stringify(controls()); if (c !== sent) { sent = c; send(JSON.parse(c)); } }
addEventListener("keydown", e => {
  if ($("sandbox").classList.contains("on")) {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Tab"].includes(k)) e.preventDefault();
    if (!keys.has(k)) {
      keys.add(k);
      if (k === "c") send({ opponent: !(cur && cur.opponent_on) });
      if (k === "r") { send({ reset: true }); trail = []; }
    }
    if (k === "+" || k === "=") zoom = Math.min(8, zoom * 1.1);
    if (k === "-") zoom = Math.max(0.02, zoom / 1.1);
    sync();
  }
});
addEventListener("keyup", e => { keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key); sync(); });
addEventListener("blur", () => { keys.clear(); sync(); });
canvas.addEventListener("wheel", e => { zoom = Math.min(8, Math.max(0.02, zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); });

function pose(i, alpha) {
  const b = cur.ships[i], a = prev ? prev.ships[i] : b;
  let turn = b.heading - a.heading; turn = (turn + Math.PI) % (2 * Math.PI) - Math.PI;
  return { x: a.x + alpha * (b.x - a.x), y: a.y + alpha * (b.y - a.y), heading: a.heading + alpha * turn, alive: b.alive, angle: b.angle, speed: b.speed };
}
function frame() {
  requestAnimationFrame(frame);
  if (!$("sandbox").classList.contains("on")) return;
  const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
  g.clearRect(0, 0, w, h);
  if (!cur || !setup) return;
  const alpha = Math.min(1, (performance.now() - curAt) / (1000 * setup.tick));
  const me = pose(0, alpha), foe = pose(1, alpha);
  const sx = x => w / 2 + (x - me.x) * zoom, sy = y => h / 2 - (y - me.y) * zoom;
  // grid
  const spacing = [25, 50, 100, 250, 500, 1000, 2500].find(s => s * zoom >= 40) || 2500;
  g.lineWidth = 1;
  for (let i = Math.floor((me.x - w / 2 / zoom) / spacing); i <= Math.ceil((me.x + w / 2 / zoom) / spacing); i++) { g.strokeStyle = i % 4 ? "#1b2330" : "#2a3546"; g.beginPath(); g.moveTo(sx(i * spacing), 0); g.lineTo(sx(i * spacing), h); g.stroke(); }
  for (let i = Math.floor((me.y - h / 2 / zoom) / spacing); i <= Math.ceil((me.y + h / 2 / zoom) / spacing); i++) { g.strokeStyle = i % 4 ? "#1b2330" : "#2a3546"; g.beginPath(); g.moveTo(0, sy(i * spacing)); g.lineTo(w, sy(i * spacing)); g.stroke(); }
  for (const [r, c] of [[setup.arena_radius, "#d29922"], [setup.arena_radius + setup.ramp, "#8b3a3a"]]) { g.strokeStyle = c; g.beginPath(); g.arc(sx(0), sy(0), r * zoom, 0, 7); g.stroke(); }
  g.strokeStyle = "#4d7cfe55";
  for (const [fx, fy, r, band] of setup.fields) { for (const rr of [r - band / 2, r + band / 2]) if (rr > 0) { g.beginPath(); g.arc(sx(fx), sy(fy), rr * zoom, 0, 7); g.stroke(); } }
  g.strokeStyle = "#3b6ea8"; g.lineWidth = 2; g.beginPath(); trail.forEach(([x, y], i) => (i ? g.lineTo(sx(x), sy(y)) : g.moveTo(sx(x), sy(y)))); g.stroke();
  g.strokeStyle = "#ffd166";
  for (const [x, y, dx, dy] of cur.bullets) { g.beginPath(); g.moveTo(sx(x - dx), sy(y - dy)); g.lineTo(sx(x), sy(y)); g.stroke(); }
  for (const [p, color] of [[foe, "#ff6b6b"], [me, "#58a6ff"]]) {
    if (!p.alive) continue;
    const size = Math.max(12, 10 / zoom), c = Math.cos(p.heading), s = Math.sin(p.heading);
    g.fillStyle = color; g.strokeStyle = "#fff"; g.lineWidth = 1; g.beginPath();
    [[1.6, 0], [-1, 0.8], [-0.5, 0], [-1, -0.8]].forEach(([u, v], i) => { const X = sx(p.x + size * (u * c - v * s)), Y = sy(p.y + size * (u * s + v * c)); i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.closePath(); g.fill(); g.stroke();
    const track = p.heading - p.angle; g.strokeStyle = "#7ee787"; g.beginPath(); g.moveTo(sx(p.x), sy(p.y)); g.lineTo(sx(p.x + 0.5 * p.speed * Math.cos(track)), sy(p.y + 0.5 * p.speed * Math.sin(track))); g.stroke();
  }
  const r = cur.readout, p = $("preset").value.replace(/^saved:/, "");
  $("hud").textContent = `ship    ${p} (as tuned in Ships), ${$("factor").value}x real time
speed   ${shown("speed", r.speed, 1)}
turn    ${(r.turn_rate_degrees * scaleOf("angular_rate") / DEG).toFixed(1)} deg/s   radius ${r.turn_radius === null ? "-" : shown("length", r.turn_radius)}
g       ${r.lateral_g.toFixed(2)} lateral
AoA     ${r.angle_of_attack_degrees.toFixed(2)} deg (stall ${r.stall_degrees.toFixed(1)})
store   ${(100 * r.store).toFixed(1)} %   shield ${(100 * r.shield).toFixed(0)} %
deaths ${cur.deaths}   opponent kills ${cur.kills}   opponent ${cur.opponent_on ? "on" : "off"}`;
}
requestAnimationFrame(frame);
init().then(() => { if (location.hash === "#sandbox") show("sandbox"); });
</script>
</body>
</html>
