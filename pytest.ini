[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow"
markers =
    slow: re-renders every published figure to verify docs/; run before publishing, not per commit
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning